<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nick painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e7eaf1;
  --panel: #ffffff;
  --ink: #1d2230;
  --muted: #586078;
  --line: #c8cedb;
  --focus: #c98a00;
  --btn: #eef1f6;
  --btn-hover: #e1e6ef;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2030; --panel: #252c3e; --ink: #ece8dc; --muted: #a2aac0;
    --line: #3b4560; --focus: #ffd75e; --btn: #2f3850; --btn-hover: #3a4560;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2030; --panel: #252c3e; --ink: #ece8dc; --muted: #a2aac0;
  --line: #3b4560; --focus: #ffd75e; --btn: #2f3850; --btn-hover: #3a4560;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
}
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-family: var(--pixel); font-weight: 700; font-size: 2rem; line-height: 1.1; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 20px; }
h2 { font-family: var(--pixel); font-weight: 600; font-size: 1.15rem; margin: 0 0 10px; }

/* The in-game scene */
.scene {
  position: relative; border-radius: 6px; overflow: hidden;
  background:
    linear-gradient(to bottom, transparent 70%, #6aa83f 70%, #6aa83f 76%, #7a5634 76%);
  background-color: #8db8ff;
  min-height: 170px; padding: 18px;
  display: flex; align-items: flex-end;
  image-rendering: pixelated;
}
.scene::before { /* blocky clouds */
  content: ""; position: absolute; left: 12%; top: 18px; width: 96px; height: 24px;
  background: #fff; opacity: .85;
  box-shadow: 64px 12px 0 #fff, 300px -4px 0 #fff, 340px 6px 0 #fff;
}
.chat {
  position: relative; background: rgba(0,0,0,.45); padding: 6px 10px;
  font-family: var(--pixel); font-size: clamp(18px, 4.6vw, 26px); line-height: 1.3;
  color: #fff; text-shadow: 2px 2px 0 #3f3f3f; max-width: 100%; overflow-wrap: anywhere;
}
.chat .fixed { color: #fff; }

/* Letter tiles */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-top: 16px; }
.name-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.name-row label { font-weight: 700; }
input[type="text"] {
  font: inherit; font-size: 1.05rem; padding: 8px 10px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 200px;
}
.tiles {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.tile {
  width: 46px; height: 54px; border-radius: 4px; border: 2px solid #3a3a3a;
  background: #2b2b2b; font-family: var(--pixel); font-size: 28px; cursor: pointer;
  display: grid; place-items: center; padding: 0; transition: transform .08s;
}
.tile.sel { border-color: var(--focus); transform: translateY(-3px); box-shadow: 0 3px 0 var(--focus); }
.sel-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }

button.btn {
  font: inherit; font-size: .95rem; padding: 7px 12px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--btn); color: var(--ink); cursor: pointer;
}
button.btn:hover { background: var(--btn-hover); }
button.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 700; }
button.primary:hover { background: var(--ink); opacity: .88; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Palette */
.palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
@media (max-width: 480px) { .palette { grid-template-columns: repeat(4, 1fr); } }
.swatch {
  border: 2px solid #00000033; border-radius: 4px; height: 52px; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 0 3px;
  font-family: var(--pixel); font-size: 13px; color: #fff; text-shadow: 1px 1px 0 #000;
}
.formats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.formats .btn { min-width: 44px; font-family: var(--pixel); font-size: 1.05rem; }
.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
@media (max-width: 560px) { .extras { grid-template-columns: 1fr; } }
.extras h3 { font-size: .98rem; margin: 0 0 6px; }
.pick-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type="color"] { width: 46px; height: 38px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 2px; cursor: pointer; }

/* Output */
.output {
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: .95rem;
  width: 100%; min-height: 64px; resize: vertical; padding: 10px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); overflow-wrap: anywhere;
}
.out-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
select { font: inherit; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.notes { color: var(--muted); font-size: .92rem; margin: 12px 0 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Nick painter</h1>
  <p class="lede">Colour your name letter by letter, then copy the /nick command into the game.</p>

  <div class="scene" aria-label="Preview of your name in chat">
    <div class="chat" id="preview"></div>
  </div>

  <section class="panel">
    <div class="name-row">
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="16" autocomplete="off" spellcheck="false" value="YourName">
    </div>
    <div class="tiles" id="tiles" role="group" aria-label="Letters, tap or drag to select"></div>
    <div class="sel-row">
      <button class="btn" id="selAll">Select all</button>
      <button class="btn" id="selNone">Clear selection</button>
      <p class="hint" id="selHint"></p>
    </div>
  </section>

  <section class="panel">
    <h2>Colour</h2>
    <div class="palette" id="palette"></div>
    <div class="formats" role="group" aria-label="Formatting">
      <button class="btn" data-fmt="b" aria-pressed="false" style="font-weight:700">B</button>
      <button class="btn" data-fmt="i" aria-pressed="false" style="font-style:italic">I</button>
      <button class="btn" data-fmt="u" aria-pressed="false" style="text-decoration:underline">U</button>
      <button class="btn" data-fmt="s" aria-pressed="false" style="text-decoration:line-through">S</button>
      <button class="btn" id="clearFmt">Remove formatting</button>
    </div>
    <div class="extras">
      <div>
        <h3>Custom colour</h3>
        <div class="pick-row">
          <input type="color" id="custom" value="#ff88cc" aria-label="Custom colour">
          <button class="btn" id="applyCustom">Apply</button>
        </div>
      </div>
      <div>
        <h3>Gradient</h3>
        <div class="pick-row">
          <input type="color" id="gradA" value="#ff5555" aria-label="Gradient start">
          <input type="color" id="gradB" value="#55ffff" aria-label="Gradient end">
          <button class="btn" id="applyGrad">Apply</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Your command</h2>
    <textarea class="output" id="output" readonly aria-label="Generated command"></textarea>
    <div class="out-row">
      <button class="btn primary" id="copyCmd">Copy command</button>
      <button class="btn" id="copyCode">Copy name code only</button>
      <label id="hexWrap" hidden>Hex style
        <select id="hexFmt">
          <option value="amp">&amp;#RRGGBB</option>
          <option value="x">&amp;x&amp;R&amp;R&amp;G&amp;G&amp;B&amp;B</option>
        </select>
      </label>
    </div>
    <ul class="notes">
      <li id="lenNote"></li>
      <li>Custom colours and gradients use hex codes, which not every server supports. If they show up as plain text in game, stick to the 16 swatches.</li>
    </ul>
  </section>
</main>

<script>
const COLORS = [
  ['0','Black','000000'],['1','Dark blue','0000AA'],['2','Dark green','00AA00'],['3','Dark aqua','00AAAA'],
  ['4','Dark red','AA0000'],['5','Dark purple','AA00AA'],['6','Gold','FFAA00'],['7','Gray','AAAAAA'],
  ['8','Dark gray','555555'],['9','Blue','5555FF'],['a','Green','55FF55'],['b','Aqua','55FFFF'],
  ['c','Red','FF5555'],['d','Light purple','FF55FF'],['e','Yellow','FFFF55'],['f','White','FFFFFF']
];
const MAP = Object.fromEntries(COLORS.map(c => [c[0], c[2]]));
const STORE = 'nick-painter-v1';

let letters = [];
const sel = new Set();
let hexFmt = 'amp';

const $ = id => document.getElementById(id);
const nameIn = $('name'), tilesEl = $('tiles');

function blank(ch) { return { ch, color: 'f', b: false, i: false, u: false, s: false }; }
function hexOf(color) { return color.length === 1 ? MAP[color] : color.slice(1).toUpperCase(); }
function shadowOf(color) {
  const h = hexOf(color);
  return '#' + [0, 2, 4].map(k => Math.floor(parseInt(h.slice(k, k + 2), 16) / 4).toString(16).padStart(2, '0')).join('');
}
function styleSpan(el, L) {
  el.style.color = '#' + hexOf(L.color);
  el.style.textShadow = '2px 2px 0 ' + shadowOf(L.color);
  el.style.fontWeight = L.b ? '700' : '400';
  el.style.fontStyle = L.i ? 'italic' : 'normal';
  const deco = [L.u && 'underline', L.s && 'line-through'].filter(Boolean).join(' ');
  el.style.textDecoration = deco || 'none';
}

function codeFor(color) {
  if (color.length === 1) return '&' + color;
  const h = color.slice(1).toUpperCase();
  return hexFmt === 'amp' ? '&#' + h : '&x' + [...h].map(c => '&' + c).join('');
}
function fmtStr(L) { return (L.b ? 'l' : '') + (L.s ? 'm' : '') + (L.u ? 'n' : '') + (L.i ? 'o' : ''); }
function build() {
  let out = '', pc = null, pf = '';
  for (const L of letters) {
    const f = fmtStr(L);
    const keepsOld = [...pf].every(x => f.includes(x));
    if (L.color !== pc || !keepsOld) {
      out += codeFor(L.color) + [...f].map(x => '&' + x).join('');
    } else if (f !== pf) {
      out += [...f].filter(x => !pf.includes(x)).map(x => '&' + x).join('');
    }
    pc = L.color; pf = f; out += L.ch;
  }
  return out;
}

function targets() {
  return sel.size ? [...sel].sort((a, b) => a - b) : letters.map((_, i) => i);
}

function buildTiles() {
  tilesEl.innerHTML = '';
  letters.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.i = i; b.textContent = L.ch;
    tilesEl.appendChild(b);
  });
}

function render() {
  // tiles
  [...tilesEl.children].forEach((t, i) => {
    styleSpan(t, letters[i]);
    t.classList.toggle('sel', sel.has(i));
    t.setAttribute('aria-pressed', sel.has(i));
    t.setAttribute('aria-label', 'Letter ' + letters[i].ch + (sel.has(i) ? ', selected' : ''));
  });
  // preview
  const p = $('preview'); p.innerHTML = '';
  const open = document.createElement('span'); open.className = 'fixed'; open.textContent = '<'; p.appendChild(open);
  letters.forEach(L => { const s = document.createElement('span'); s.textContent = L.ch; styleSpan(s, L); p.appendChild(s); });
  const close = document.createElement('span'); close.className = 'fixed'; close.textContent = '> hey everyone!'; p.appendChild(close);
  // selection hint
  $('selHint').textContent = !letters.length ? 'Type a name to get started.'
    : sel.size ? sel.size + ' of ' + letters.length + ' letters selected.'
    : 'Nothing selected, so changes apply to every letter. Tap or drag across letters to pick some.';
  // format buttons
  const t = targets();
  document.querySelectorAll('[data-fmt]').forEach(btn => {
    const k = btn.dataset.fmt;
    btn.setAttribute('aria-pressed', t.length > 0 && t.every(i => letters[i][k]));
  });
  // output
  const code = build();
  $('output').value = letters.length ? '/nick ' + code : '';
  $('hexWrap').hidden = !letters.some(L => L.color.length > 1);
  $('lenNote').textContent = letters.length
    ? 'Your name is ' + letters.length + ' letters, or ' + code.length + ' characters with the colour codes. If the server says it\'s too long, use fewer colour changes.'
    : '';
  save();
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ letters, hexFmt })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d && Array.isArray(d.letters) && d.letters.length) {
      letters = d.letters; hexFmt = d.hexFmt === 'x' ? 'x' : 'amp'; return true;
    }
  } catch (e) {}
  return false;
}

function setName(raw) {
  const clean = raw.replace(/[^A-Za-z0-9_]/g, '').slice(0, 16);
  if (clean !== raw) nameIn.value = clean;
  letters = [...clean].map((ch, i) => letters[i] ? { ...letters[i], ch } : blank(ch));
  [...sel].forEach(i => { if (i >= letters.length) sel.delete(i); });
  buildTiles(); render();
}

// Palette
const pal = $('palette');
COLORS.forEach(([c, name, hex]) => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.style.background = '#' + hex; b.textContent = '&' + c;
  b.title = name; b.setAttribute('aria-label', name + ' (&' + c + ')');
  b.addEventListener('click', () => { targets().forEach(i => letters[i].color = c); render(); });
  pal.appendChild(b);
});

// Formats
document.querySelectorAll('[data-fmt]').forEach(btn => btn.addEventListener('click', () => {
  const k = btn.dataset.fmt, t = targets();
  const on = !t.every(i => letters[i][k]);
  t.forEach(i => letters[i][k] = on); render();
}));
$('clearFmt').addEventListener('click', () => {
  targets().forEach(i => Object.assign(letters[i], { b: false, i: false, u: false, s: false })); render();
});

// Custom + gradient
$('applyCustom').addEventListener('click', () => {
  const v = $('custom').value.toLowerCase(); targets().forEach(i => letters[i].color = v); render();
});
$('applyGrad').addEventListener('click', () => {
  const t = targets(); if (!t.length) return;
  const a = $('gradA').value.slice(1), z = $('gradB').value.slice(1);
  const ch = (h, k) => parseInt(h.slice(k, k + 2), 16);
  t.forEach((idx, n) => {
    const f = t.length === 1 ? 0 : n / (t.length - 1);
    letters[idx].color = '#' + [0, 2, 4].map(k => Math.round(ch(a, k) + (ch(z, k) - ch(a, k)) * f).toString(16).padStart(2, '0')).join('');
  });
  render();
});

// Selection: tap, drag, keyboard
$('selAll').addEventListener('click', () => { letters.forEach((_, i) => sel.add(i)); render(); });
$('selNone').addEventListener('click', () => { sel.clear(); render(); });
let dragging = false, dragAdd = true;
function tileAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.tile') : null; }
function mark(i) { dragAdd ? sel.add(i) : sel.delete(i); render(); }
tilesEl.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  e.preventDefault(); t.focus({ preventScroll: true });
  const i = +t.dataset.i; dragging = true; dragAdd = !sel.has(i); mark(i);
  try { tilesEl.setPointerCapture(e.pointerId); } catch (err) {}
});
tilesEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  const t = tileAt(e.clientX, e.clientY); if (!t) return;
  const i = +t.dataset.i; if (sel.has(i) !== dragAdd) mark(i);
});
['pointerup', 'pointercancel'].forEach(ev => tilesEl.addEventListener(ev, () => dragging = false));
tilesEl.addEventListener('click', e => {
  if (e.detail !== 0) return; // pointer clicks are already handled
  const t = e.target.closest('.tile'); if (!t) return;
  const i = +t.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); render();
});

// Output
$('hexFmt').addEventListener('change', e => { hexFmt = e.target.value; render(); });
async function copy(text, btn) {
  const label = btn.textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const o = $('output'); o.focus(); o.select();
    try { ok = document.execCommand('copy'); } catch (err) {}
  }
  btn.textContent = ok ? 'Copied' : 'Select and copy the text above';
  setTimeout(() => btn.textContent = label, 1600);
}
$('copyCmd').addEventListener('click', e => copy($('output').value, e.currentTarget));
$('copyCode').addEventListener('click', e => copy(build(), e.currentTarget));

nameIn.addEventListener('input', () => setName(nameIn.value));

// Start
if (load()) { nameIn.value = letters.map(L => L.ch).join(''); $('hexFmt').value = hexFmt; buildTiles(); render(); }
else setName(nameIn.value);
</script>
</body>
</html>
